[package]
name = "organizemymac"
version = "0.1.0"
description = "Storage analysis, safe cleanup and app management for macOS"
authors = ["Gutu Galuppo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "organizemymac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12.0"
blake3 = "1.8.7"
regex = "1"
plist = "1.10.1"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
dirs = "7.0.0"
trash = "5.2.9"
uuid = { version = "1.26.1", features = ["v4"] }
libc = "0.2.189"
tauri-plugin-dialog = "2.8.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
sysinfo = "0.38.4"
base64 = "0.23.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "libc"] }
ureq = "2"
roxmltree = "0.21.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
rayon = "1.12.0"
tempfile = "3.27.0"
